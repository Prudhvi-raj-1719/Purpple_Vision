# Store Intelligence — Docker Compose (SQLite only)
# API only:  docker compose up --build
# API + UI:  docker compose --profile dashboard up --build
# For hackathon video demo, local Streamlit + committed SQLite is usually simpler (see README).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/store_intelligence.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      STALE_FEED_THRESHOLD_MINUTES: ${STALE_FEED_THRESHOLD_MINUTES:-10}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-dashboard
    profiles:
      - dashboard
    command:
      [
        "streamlit",
        "run",
        "dashboard/streamlit_app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://api:8000
      # Dashboard defaults to reading bound SQLite (DASHBOARD_USE_API unset).
      # Set DASHBOARD_USE_API=true to force HTTP mode against the api service.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
