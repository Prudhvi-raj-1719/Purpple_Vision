# Store Intelligence — Docker Compose (SQLite only)
# Services: API + optional Streamlit dashboard. No database container.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/store_intelligence.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-dashboard
    profiles:
      - dashboard
    command:
      [
        "streamlit",
        "run",
        "dashboard/streamlit_app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
